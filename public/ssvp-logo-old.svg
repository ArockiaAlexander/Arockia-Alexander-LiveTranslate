<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer White Ring -->
  <circle cx="100" cy="100" r="98" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Curved Text Definitions -->
  <defs>
    <path id="ssvp-top-text-arc" d="M 22,100 A 78,78 0 1,1 178,100" fill="none" />
    <path id="ssvp-bottom-text-arc" d="M 178,100 A 78,78 0 0,1 22,100" fill="none" />
  </defs>

  <!-- Outer Top Ring Text -->
  <text font-width="100%">
    <textPath href="#ssvp-top-text-arc" startOffset="50%" text-anchor="middle" fill="#092066" font-size="11.8" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.4px">
      SOCIETY OF ST. VINCENT DE PAUL
    </textPath>
  </text>

  <!-- Outer Bottom Ring Text -->
  <text font-width="100%">
    <textPath href="#ssvp-bottom-text-arc" startOffset="50%" text-anchor="middle" fill="#092066" font-size="11.5" font-weight="900" font-family="Arial, Helvetica, sans-serif" letter-spacing="0.4px">
      NATIONAL COUNCIL OF INDIA
    </textPath>
  </text>

  <!-- Inner Sky Blue Circle -->
  <circle cx="100" cy="100" r="66" fill="#0090df" />

  <!-- Top Inner Red "SSVP" Text with White Outline -->
  <g>
    <text x="100" y="64" text-anchor="middle" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" font-size="27" font-weight="900" font-family="'Arial Black', 'Impact', sans-serif" letter-spacing="1px">
      SSVP
    </text>
    <text x="100" y="64" text-anchor="middle" fill="#d80000" font-size="27" font-weight="900" font-family="'Arial Black', 'Impact', sans-serif" letter-spacing="1px">
      SSVP
    </text>
  </g>

  <!-- Center White Fish Loop (Ichthys Symbol) -->
  <path d="M 152,86 C 120,90 64,96 47,99 C 39,101 39,111 47,113 C 64,116 120,122 152,126" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none" />
  <path d="M 47,99 C 75,108 125,120 152,126 M 47,113 C 75,104 125,92 152,86" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" fill="none" />

  <!-- Red Dot inside Left Head of Fish Loop -->
  <circle cx="58" cy="106" r="5" fill="#d80000" />

  <!-- Bottom Inner Text: "Service in Hope" -->
  <text x="100" y="148" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600" font-style="italic" font-family="'Georgia', 'Times New Roman', serif">
    Service in Hope
  </text>
</svg>
